name: desktop builds

# Builds the Electron desktop app natively on each OS:
#   macOS   -> .dmg + .zip (arm64 + x64, unsigned)
#   Windows -> NSIS installer + portable .exe (x64)
#   Linux   -> .AppImage + .tar.gz (x64)
# Artifacts are attached to the workflow run; tagged pushes (v*) also attach
# them to a draft GitHub release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            name: macos
          - os: windows-latest
            target: --win
            name: windows
          - os: ubuntu-latest
            target: --linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # unsigned builds; add CSC_LINK/CSC_KEY_PASSWORD secrets to sign
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: backrooms-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
